[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html"
version = "0.1.0"
description = "Convert Markdown files to clean, modern, and semantic HTML"
authors = [{ name = "Developer" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.4",
]

[project.scripts]
md2html = "md2html.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

